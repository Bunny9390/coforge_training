<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Registration Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow mx-auto" style="width: 650px;">

        <div class="card-header bg-primary text-white text-center">
            <h3>Employee Registration Form</h3>
        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <tr>
                    <th>Employee ID</th>
                    <td>
                        <input type="text" class="form-control" placeholder="Enter Employee ID">
                    </td>
                </tr>

                <tr>
                    <th>Employee Name</th>
                    <td>
                        <input type="text" class="form-control" placeholder="Enter Employee Name">
                    </td>
                </tr>

                <tr>
                    <th>Employee Salary</th>
                    <td>
                        <input type="number" class="form-control" placeholder="Enter Employee Salary">
                    </td>
                </tr>

                <tr>
                    <th>Department No</th>
                    <td>
                        <input type="text" class="form-control" placeholder="Enter Department No">
                    </td>
                </tr>

                <tr>
                    <th>Employee Email</th>
                    <td>
                        <input type="email" class="form-control" placeholder="Enter Employee Email">
                    </td>
                </tr>

                <tr>
                    <td colspan="2" class="text-center">

                        <input type="submit" value="Insert" class="btn btn-success me-2">

                        <input type="submit" value="Delete" class="btn btn-danger me-2">

                        <input type="submit" value="Update" class="btn btn-warning me-2">

                        <input type="submit" value="Find" class="btn btn-info text-white me-2">

                        <input type="submit" value="Find All" class="btn btn-secondary">

                    </td>
                </tr>

            </table>

        </div>

    </div>

</div>

</body>
</html>
