<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
<script type="text/javascript">
	function calculate(operator) {
		var n1 = parseInt(document.getElementById("n1").value);
		var n2 = parseInt(document.getElementById("n2").value);
		var res = "";
		
		if(operator == "add")
			res = "Addition :" + (n1+n2);
		if(operator == "sub")
			res = "Subraction :" + (n1-n2);
		if(operator == "mul")
			res = "Multiplication :" + (n1*n2);
		if(operator == "div")
			res = "Division :" + (n1/n2);
		document.getElementById("ResultDiv").innerHTML="<b>"+res+"<b>";
	}

</script>
</head>
<body>
Enter no1<input type="number" id="n1"/>
Enter no1<input type="number" id="n2"/>
<br>
<div id="ResultDiv"></div>
<button onclick="calculate('add')">Addition</button>
<button onclick="calculate('sub')">Subraction</button>
<button onclick="calculate('mul')">Multiplication</button>
<button onclick="calculate('div')">Division</button>
</body>
</html>
