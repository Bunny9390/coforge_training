<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bootstrap Grid System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.header{
    background:#4f79c7;
    height:130px;
    border-radius:25px;
    font-size:60px;
    font-weight:bold;
    text-align:center;
    line-height:130px;
}

.col1{
    background:#73b245;
    height:350px;
    border-radius:40px;
    font-size:40px;
    font-weight:bold;
    text-align:center;
    line-height:350px;
}

.col2{
    background:#f57c2a;
    height:350px;
    border-radius:40px;
    font-size:40px;
    font-weight:bold;
    text-align:center;
    line-height:350px;
}

.col3{
    background:#ffc107;
    height:350px;
    border-radius:40px;
    font-size:40px;
    font-weight:bold;
    text-align:center;
    line-height:350px;
}

.footer{
    background:#5d9bd5;
    height:60px;
    border-radius:10px;
    font-size:35px;
    font-weight:bold;
    text-align:center;
    line-height:60px;
}
</style>

</head>

<body>

<div class="container mt-5">

    <!-- Header -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="header">Header</div>
        </div>
    </div>

    <!-- Three Columns -->
    <div class="row mb-4">

        <div class="col-lg-4 col-md-4 col-sm-12 mb-3">
            <div class="col1">Column 1</div>
        </div>

        <div class="col-lg-4 col-md-4 col-sm-12 mb-3">
            <div class="col2">Column 2</div>
        </div>

        <div class="col-lg-4 col-md-4 col-sm-12 mb-3">
            <div class="col3">Column 3</div>
        </div>

    </div>

    <!-- Footer -->
    <div class="row">
        <div class="col-12">
            <div class="footer">Footer</div>
        </div>
    </div>

</div>

</body>
</html>
