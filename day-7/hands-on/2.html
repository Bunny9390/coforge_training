<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Table</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    table{
        margin:auto;
        width:80%;
        text-align:center;
    }
    th,td{
        border:2px solid gray !important;
        padding:15px;
    }
    .title{
        font-size:28px;
        font-weight:bold;
        background-color:#f8f9fa;
    }
    .days{
        background-color:#e9ecef;
        font-weight:bold;
    }
    .lunch{
        background-color:#fff3cd;
        font-weight:bold;
        font-size:20px;
    }
    .hours{
        background-color:#d1ecf1;
        font-weight:bold;
        vertical-align:middle;
        font-size:20px;
    }
</style>
</head>
<body class="bg-light">
<div class="container mt-5">
<table class="table table-bordered">
    <tr>
        <th colspan="6" class="title">Time Table</th>
    </tr>
    <tr>
        <th rowspan="6" class="hours">Hours</th>
        <th class="days">Mon</th>
        <th class="days">Tue</th>
        <th class="days">Wed</th>
        <th class="days">Thu</th>
        <th class="days">Fri</th>
    </tr>
    <tr>
        <td>Science</td>
        <td>Maths</td>
        <td>Science</td>
        <td>Maths</td>
        <td>Arts</td>
    </tr>
    <tr>
        <td>Science</td>
        <td>Maths</td>
        <td>Science</td>
        <td>Maths</td>
        <td>Arts</td>
    </tr>
    <tr>
        <td colspan="5" class="lunch">LUNCH</td>
    </tr>
    <tr>
        <td>Science</td>
        <td>Maths</td>
        <td>Science</td>
        <td>Maths</td>
        <td rowspan="2">Project</td>
    </tr>
    <tr>
        <td>Science</td>
        <td>Maths</td>
        <td>Science</td>
        <td>Maths</td>
    </tr>
</table>
</div>
</body>
</html>
